# ~/.config/waybill/config.toml. Every key is optional; these are the
# defaults.

[task]
# The Taskwarrior command. It may carry arguments: "task rc:~/work.taskrc".
command = "task"

[notes]
# Folder of <uuid>.md notes. Empty means notes/ under Taskwarrior's
# data.location.
dir = ""

[tags]
# Tags that mean "this needs a person's hands". Tasks with one land in
# Needs you, and visits that open with the first one ("Me: ...") are rulings.
hands = ["me"]
# A task blocked on a choice. It lands in Needs you as well.
decision = "decision"

[lint]
# What `waybill lint` and `waybill add` hold a task to.
title = 50                              # the longest a card title may be
tags = ["research", "bug", "verify"]    # allowed besides the tags above
projects = []                           # known projects; empty allows any

[bar]
# What the waybar module shows when something waits on you, and when
# nothing does. {lamp} {holding} {you} {ready} {doing} {done}
format = "● {holding}"
format_calm = "●"

[board]
# Open the window fullscreen, over the bar. Leave it off to let the
# compositor size it (alone on a workspace, it fills the workspace).
fullscreen = false

[theme]
# "waybar" borrows the bar's colors and font from ~/.config/waybar/style.css.
# "none" keeps the built-in theme.
from = "waybar"
# font = "JetBrains Mono"
# accent = "#88c0d0"
